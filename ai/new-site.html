<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On the Dot</title>
    <link rel="stylesheet" href="new-styles.css">
</head>
<body>
    <header class="otd-header">
        <div class="otd-header__logo">
            <img src="img/on-the-dot-logo-horizontal.png" width="340" height="80" alt="On the Dot">
        </div>
        <p class="otd-header__tagline">Boulder's finest indie rock collective</p>
    </header>

    <!-- Hero Photo Section -->
    <section class="otd-photo-break otd-photo-break--hero">
        <img src="img/on-the-dot-skate-bowl.jpeg" alt="On the Dot performing" class="otd-photo-break__img">
        <div class="otd-photo-break__overlay"></div>
    </section>

    <!-- Music Section -->
    <section class="otd-section otd-section--full" id="music">
        <h2 class="otd-section__title title-text">Listen</h2>
        <nav class="otd-section__container otd-section__container--music" id="music-content">
            <a href="https://onthedot.bandcamp.com/" class="bigButton coolButton" target="_blank">Bandcamp</a>
            <a href="https://open.spotify.com/artist/4t7RVXD9RwHJz5ZuWjEisU?si=lDKFJz0iR4iY1agDujO_XA" class="diamondButton coolButton" target="_blank"><span>Spotify</span></a>
            <a href="https://music.apple.com/us/artist/on-the-dot/1647357557" class="diamondButton coolButton" target="_blank"><span>Apple</span></a>
            <a href="https://music.amazon.com/artists/B0BGMPHSV5/on-the-dot?marketplaceId=ATVPDKIKX0DER&musicTerritory=US&ref=dm_sh_1hbyvfixzk9Bt259J3dL3kuNC" class="diamondButton coolButton" target="_blank"><span>Amazon</span></a>
            <a href="https://listen.tidal.com/artist/34675267" class="diamondButton coolButton" target="_blank"><span>Tidal</span></a>
        </nav>
    </section>

    <!-- Photo Break -->
    <section class="otd-photo-break otd-photo-break--duo">
        <div class="otd-photo-break__grid">
            <img src="img/on-the-dot-mirror.jpeg" alt="On the Dot" class="otd-photo-break__img">
            <img src="img/on-the-dot-lawn.JPG" alt="On the Dot" class="otd-photo-break__img">
        </div>
    </section>

    <!-- Video Showcase Section -->
    <section class="otd-section otd-section--full otd-section--video" id="video">
        <h2 class="otd-section__title title-text">Watch</h2>
        <div class="otd-section__container otd-section__container--video">
            <div class="otd-video-showcase">
                <div class="otd-video-showcase__main">
                    <iframe 
                        src="https://www.youtube.com/embed/videoseries?list=PLHX3rVxH3xQbFEHxCkMdVKzB5UPZ0I0Vy" 
                        title="On the Dot - Featured Video" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                </div>
                <p class="otd-video-showcase__caption">Latest performances & music videos</p>
            </div>
        </div>
    </section>

    <!-- Photo Break - Single Wide -->
    <section class="otd-photo-break otd-photo-break--wide">
        <img src="img/on-the-dot-on-the-run.jpg" alt="On the Dot on the run" class="otd-photo-break__img">
    </section>

    <!-- Social Section -->
    <section class="otd-section otd-section--full" id="social">
        <h2 class="otd-section__title title-text">Connect</h2>
        <nav class="otd-section__container otd-section__container--social" id="social-content">
            <a href="https://instagram.com/onthedotband?igshid=NDRkN2NkYzU=" class="diamondButton coolButton" target="_blank"><span>Instagram</span></a>
            <a href="https://www.youtube.com/channel/UCuLLAIqkwNndPUKeErRYVig" class="diamondButton coolButton" target="_blank"><span>Youtube</span></a>
            <a href="https://www.tiktok.com/@onthedotband?_t=8yt7rkzsbwh&_r=1" class="diamondButton coolButton" target="_blank"><span>TikTok</span></a>
        </nav>
    </section>

    <!-- Photo Break - Triple -->
    <section class="otd-photo-break otd-photo-break--triple">
        <div class="otd-photo-break__grid">
            <img src="img/on-the-dot-bloomed.jpg" alt="On the Dot" class="otd-photo-break__img">
            <img src="img/on-the-dot-frank.jpg" alt="On the Dot" class="otd-photo-break__img">
            <img src="img/carmen.jpg" alt="On the Dot" class="otd-photo-break__img">
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="otd-section otd-section--full otd-section--gallery" id="gallery">
        <a href="gallery.html" class="block-anchor">
            <h2 class="otd-section__title title-text">Gallery</h2>
            <div class="otd-section__container image-gallery otd-section__container--gallery" id="gallery-content">
                <img src="img/on-the-dot-on-the-stairs.jpg" class="hor">
                <img src="img/on-the-dot-in-the-grass.JPG" class="ver">
                <img src="img/ont-the-dot-borghese.JPG" class="ver">
                <img src="img/original-dot.png" class="hor">
                <img src="img/the-dither-dudes.png" class="squ">
            </div>
        </a>
    </section>

    <!-- Photo Break -->
    <section class="otd-photo-break otd-photo-break--wide">
        <img src="img/on-the-dot-offer.jpg" alt="On the Dot" class="otd-photo-break__img">
    </section>

    <!-- Shows Section -->
    <section class="otd-section otd-section--full" id="shows">
        <h2 class="otd-section__title title-text">Upcoming Shows</h2>
        <ol class="otd-section__container otd-section__container--events">
            <p class="color-text center tall-100">no shows yet</p>
            <!-- <li class="otd-event">
                <a href="https://boulderlibrary.org/gunbarrel/" target="_blank">
                    <div class="otd-event__time-info">
                        <time class="otd-event__date" datetime="2025-10-25"><span class="otd-event__date--month">Oct</span> <span class="otd-event__date--day">25</span></time>
                        <p class="otd-event__doors">10:00am - 1:00pm</p>
                    </div>
                    <div class="otd-event__main-info">
                        <h3 class="otd-event__location">Gunbarrel Public Library Grand Opening</h3>
                        <h4 class="otd-event__lineup">On the Dot</h4>
                        <p class="otd-event__description">Boulder Public Library District is excited to announce a new Gunbarrel library location!</p>
                        <p class="otd-event__additional">6500 Lookout Rd</p>
                    </div>
                </a> 
            </li> -->
        </ol>
    </section>

    <footer class="otd-footer">
        <div class="otd-footer__content">
            <img src="img/bee-close.webp" width="80" height="80" class="circle-crop otd-footer__avatar">
            <div class="otd-footer__info">
                <p class="otd-footer__label">Get in touch</p>
                <a href="mailto:onthedotband@gmail.com" class="otd-footer__email">onthedotband@gmail.com</a>
            </div>
        </div>
        <p class="otd-footer__copyright">© 2025 On the Dot</p>
    </footer>

    <script src="js/graphics.js"></script>
    <script src="js/img-scroll.js"></script>
</body>
</html>
